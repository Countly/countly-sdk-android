# Android instrumented tests on a real phone through the Countly Device Farm.
#
# A GitHub runner builds the SDK and its test APKs, then a real Android phone runs them with
# no host computer attached: the job joins the farm's queue with a GitHub OIDC token (no farm
# secret in the repo, and fork pull requests cannot reach phones), the farm tunnels its adb
# server to this runner, and `connectedAndroidTest` runs against the phone over that tunnel.
#
# The farm client is vendored at .github/farm/client.mjs because countly-sdk-tools is private and
# a public SDK repo's token cannot check it out. The farm's Command Center must have
# CC_FARM_OIDC_REPOS include this repo and CC_FARM_SDKS include countly-sdk-android.
name: Device tests (Android)

on:
    pull_request:
      branches:
        - master
        - staging
    workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  JAVA_V: 17
  JAVA_DIST: corretto

jobs:
  android:
    name: Android real phone test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FARM_URL: https://test-deniz.count.ly/command-center/farm
    steps:
      - name: Check out the SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ env.JAVA_V }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Set AAPT2 for Android 35
        run: echo "android.aapt2FromMavenOverride=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt2" | tee -a gradle.properties

      # A fixed debug key lets each run update the test app in place, so the phone keeps its
      # per-app battery exemption; a fresh key would force a reinstall that wipes it.
      # ANDROID_USER_HOME pins where AGP reads debug.keystore: without it, AGP prefers
      # $XDG_CONFIG_HOME/.android, which GitHub runners set and sdkmanager creates.
      - name: Use the farm debug key
        env:
          FARM_DEBUG_KEYSTORE: ${{ secrets.FARM_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$FARM_DEBUG_KEYSTORE" ]; then
            echo "::warning::FARM_DEBUG_KEYSTORE is not set, so the test app cannot update the one on the phone"
            exit 0
          fi
          dir="$RUNNER_TEMP/android-user-home"
          mkdir -p "$dir"
          echo "$FARM_DEBUG_KEYSTORE" | base64 -d > "$dir/debug.keystore"
          echo "ANDROID_USER_HOME=$dir" >> "$GITHUB_ENV"

      - name: Build the SDK and its tests
        run: ./gradlew sdk:assembleDebug sdk:assembleDebugAndroidTest

      # The phone refuses an update signed with another key, so stop before taking it.
      - name: Check the test app has the farm key
        env:
          FARM_CERT_SHA256: 1983cb419cd1e314eb596a200f57e00203f2e4884ffd0044936a64331b1a1239
        run: |
          apk=sdk/build/outputs/apk/androidTest/debug/sdk-debug-androidTest.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          cert=$("$apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "test app certificate SHA-256: $cert"
          if [ "$cert" != "$FARM_CERT_SHA256" ]; then
            echo "::error::The test app is not signed with the farm key, so the phone would refuse it"
            exit 1
          fi

      - name: Join the device farm queue
        run: node .github/farm/client.mjs oidc countly-sdk-android

      - name: Take the phone and tunnel adb
        run: node .github/farm/client.mjs open

      - name: Run the instrumented tests on the phone
        run: ./gradlew sdk:connectedAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-results
          path: |
            sdk/build/outputs/androidTest-results/
            sdk/build/reports/androidTests/
          if-no-files-found: ignore

      - name: Summarise the results
        if: always()
        run: node .github/farm/client.mjs summary sdk/build/outputs/androidTest-results >> "$GITHUB_STEP_SUMMARY"

      - name: Give the phone back
        if: always() && env.FARM_TOKEN != ''
        run: node .github/farm/client.mjs release "${{ job.status }}"
