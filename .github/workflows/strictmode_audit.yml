name: The Countly Android SDK StrictMode Audit

env:
  JAVA_V: 17
  JAVA_DIST: corretto
  # Incorrect context use and unsafe intent launch detection need API 31+, and Mockito 4 can not
  # mock on API 34+, so 33 is the highest level the whole suite runs on.
  API_LEVEL: 33

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - staging
      - staging-nw
  pull_request:
    branches:
      - master
      - staging
      - staging-nw

jobs:
  strictmode:
    runs-on: ubuntu-latest
    name: StrictMode Audit
    timeout-minutes: 60

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          java-version: ${{ env.JAVA_V }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Set AAPT2 for android 35
        run: echo "android.aapt2FromMavenOverride=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt2"  | tee -a ${{ github.workspace }}/gradle.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Test results are the main workflow's job. Here a failing or flaky test must not stop the run,
      # the next step judges the violations the listener recorded.
      - name: Run the SDK tests under StrictMode
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew sdk:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.listener=ly.count.android.sdk.StrictModeAuditListener || true

      - name: Check the StrictMode violations
        run: python3 .github/scripts/strictmode_audit.py --sources sdk/src/main/java --allowlist .github/strictmode-allowlist.txt sdk/build/outputs/connected_android_test_additional_output

      - name: Upload the StrictMode records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strictmode-violations
          path: sdk/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
