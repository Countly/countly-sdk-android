name: Content & Feedback Widget Test

# Trigger: PRs targeting `staging` or `master` only. Each event fires the
# job-level gate which additionally requires the PR title to contain
# "content" (case-insensitive). The combined effect: integration runs land
# on the canonical merge paths without polluting unrelated PRs.
#
# `edited` is included so renaming a PR from "auth fix" to "content auth
# fix" picks up the gate on the next webhook delivery. PRs from forks run
# the workflow but cannot post the result comment (GitHub demotes
# `GITHUB_TOKEN` to read-only for fork PRs); artifacts still upload, which
# is enough for fork-PR review.
on:
  pull_request:
    branches:
      - master
      - staging
    types: [opened, synchronize, reopened, edited]

env:
  # API 30+ required: API 28 can't render the SDK's content overlay WebView
  # reliably (CDP attach + Vue widget framework gestures behave differently
  # below API 30). Google's registry only ships API 30 as the `google` variant
  # (Google APIs, no Play Store) — there's no `30-playstore-x64`. The demo
  # APK is side-loaded via `installDebug`, so Play Store isn't needed.
  # See: https://github.com/google/android-emulator-container-scripts/blob/master/REGISTRY.MD
  EMULATOR_REPO: us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2
  JAVA_V: 17
  JAVA_DIST: corretto

permissions:
  pull-requests: write   # for posting the result comment via `gh pr comment`
  contents: read
  checks: write

jobs:
  content-widget-test:
    # Job-level gate: only run if the PR title contains "content".
    # `contains()` in GH Actions expressions is case-insensitive, so
    # "Content widget fix" and "content overlay tweak" both trigger.
    if: contains(github.event.pull_request.title, 'content')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Content & Feedback Widget Test
    steps:
      # ------------------------------------------------------------------
      # Emulator setup — same Docker-based pattern as the SDK unit tests
      # workflow (build_and_test_sdk.yml). The image bundles a pre-booted
      # AVD, which is much faster than `reactivecircus/android-emulator-
      # runner` for one-off CI use because there's no AVD creation step.
      # ------------------------------------------------------------------
      - name: Install Docker to the Runner
        run: sudo apt-get install -y containerd.io

      - name: Pull Emulator from the Repo
        run: docker pull "$EMULATOR_REPO"

      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_V }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2.0.10

      - name: Start ADB Server
        run: adb start-server

      - name: Run Android Emulator Container
        run: |
          docker run -d \
            -e "ADBKEY=$(cat ~/.android/adbkey)" \
            --device /dev/kvm \
            --publish 5555:5555/tcp \
            "$EMULATOR_REPO"

      # ------------------------------------------------------------------
      # The docker emulator publishes ADB on `localhost:5555` (the
      # `--publish 5555:5555` flag in "Run Android Emulator Container"
      # above). That's the device serial used by every adb call below
      # and by the test runner via `--device`.
      # ------------------------------------------------------------------
      - name: Connect to the Emulator
        env:
          DEVICE_SERIAL: localhost:5555
        run: |
          adb connect "$DEVICE_SERIAL"
          adb wait-for-device
          # Block until boot is fully done — the docker image's AVD finishes
          # booting a few seconds after `adb connect` succeeds, and
          # uiautomator dumps fail noisily before that.
          for i in $(seq 1 30); do
            BOOTED=$(adb -s "$DEVICE_SERIAL" shell getprop sys.boot_completed | tr -d '\r')
            if [ "$BOOTED" = "1" ]; then
              echo "Boot completed after ${i}0s"; break
            fi
            sleep 10
          done

      - name: Set AAPT2 for android 35
        run: |
          echo "android.aapt2FromMavenOverride=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt2" \
            | tee -a "$GITHUB_WORKSPACE/gradle.properties"

      # ------------------------------------------------------------------
      # Demo install — App.java's `setWebContentsDebuggingEnabled(true)`
      # gates on `BuildConfig.DEBUG`, so the test runner's CDP attach only
      # works against a debug build. installDebug pushes that to the device.
      #
      # COUNTLY_SERVER_URL / COUNTLY_APP_KEY come from repository secrets
      # (`Settings → Secrets and variables → Actions`). The build's
      # `buildConfigField` declaration picks them up via System.getenv.
      # If a secret is missing, the gradle build falls back to the hard-
      # coded default in app/build.gradle — sufficient for smoke tests
      # but won't reach a private staging server.
      # ------------------------------------------------------------------
      - name: Build & install the demo app
        env:
          COUNTLY_SERVER_URL: ${{ secrets.COUNTLY_SERVER_URL }}
          COUNTLY_APP_KEY: ${{ secrets.COUNTLY_APP_KEY }}
        run: ./gradlew :app:installDebug

      # ------------------------------------------------------------------
      # Run the sweep. The runner is stdlib-only Python — no pip install
      # needed. Output goes to .github/scripts/test_output/<run-id>/.
      # ------------------------------------------------------------------
      - name: Run content & feedback test sweep
        id: sweep
        # Continue past sweep FAILs so the artifact upload + PR comment
        # still run. The "Reflect sweep outcome" step at the bottom
        # re-asserts the exit code to mark the workflow red on failure.
        continue-on-error: true
        env:
          DEVICE_SERIAL: localhost:5555
        run: |
          python3 .github/scripts/content_test_runner.py --device "$DEVICE_SERIAL"

      # ------------------------------------------------------------------
      # Locate the output dir of the run we just executed. The runner
      # creates one timestamped subdir per invocation; pick the most recent.
      # ------------------------------------------------------------------
      - name: Locate run directory
        id: run-dir
        if: always()
        run: |
          LATEST=$(ls -t .github/scripts/test_output/ 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "No run directory found — sweep didn't produce output"
            echo "run_dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_dir=.github/scripts/test_output/$LATEST" >> "$GITHUB_OUTPUT"
          echo "Run dir: .github/scripts/test_output/$LATEST"

      - name: Upload sweep artifacts
        if: always() && steps.run-dir.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: content-widget-sweep
          path: ${{ steps.run-dir.outputs.run_dir }}/
          retention-days: 14

      # ------------------------------------------------------------------
      # Convert each variant's verdict.json into a JUnit testsuite so the
      # publish-unit-test-result-action can render per-test detail as a PR
      # check — same UX the SDK unit tests already use in build_and_test_sdk.
      #
      # One <testcase> per checklist key, plus synthetic
      # `no_fatal_exceptions` / `no_strict_mode_violations` cases that
      # surface the runner's variant-level signals (which live outside the
      # checklist). Runner errors[] go to <system-err> so they're visible
      # in the suite detail without inflating the failure count.
      # ------------------------------------------------------------------
      - name: Convert verdicts to JUnit XML
        if: always() && steps.run-dir.outputs.run_dir != ''
        env:
          RUN_DIR: ${{ steps.run-dir.outputs.run_dir }}
        run: |
          python3 .github/scripts/verdict_to_junit.py \
            "$RUN_DIR" "$RUN_DIR/junit.xml"

      # ------------------------------------------------------------------
      # Publish per-test results to the PR. Same action used by
      # build_and_test_sdk.yml, so the UI is consistent with SDK unit tests.
      # The check shows a per-suite (per-variant) tally and lets reviewers
      # click into a failing testcase to see the failure message — pulled
      # from verdict.json's `detail` field via the converter.
      # ------------------------------------------------------------------
      - name: Publish content/feedback test results to PR
        if: always() && steps.run-dir.outputs.run_dir != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: "Content & Feedback Widget Results :rocket:"
          comment_title: "Content & Feedback Widget Results :rocket:"
          files: ${{ steps.run-dir.outputs.run_dir }}/junit.xml

      # ------------------------------------------------------------------
      # Post or update the results comment on the PR.
      #
      # All user-controlled values flow via `env:`, never via direct
      # `${{ ... }}` interpolation in the run script — that's the workflow-
      # injection-safe pattern. The PR title (which we gated on but don't
      # use in the comment body) is also a potential injection vector if
      # echoed into shell; we don't echo it here so it stays safe.
      #
      # Comment-reuse strategy: every body starts with a hidden HTML
      # marker. On each run we list the PR's comments, look for one
      # carrying the marker, and PATCH that comment if found — otherwise
      # create a new one. Net effect: a single living comment that always
      # reflects the latest run, instead of a long thread of stale results.
      # The marker stays invisible in the rendered PR.
      #
      # Comment body strategy: take the runner's auto-generated summary.md
      # (which already has a per-variant verdict table) and prepend a
      # status header + link back to this workflow run. The artifact upload
      # is the source of truth for full per-variant verdict.json +
      # logcat.txt + recording.mp4.
      # ------------------------------------------------------------------
      - name: Post or update results comment on PR
        if: always() && steps.run-dir.outputs.run_dir != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          RUN_DIR: ${{ steps.run-dir.outputs.run_dir }}
        run: |
          SUMMARY="$RUN_DIR/summary.md"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"

          # Hidden marker that identifies our comment across runs. Kept on
          # its own line so a `contains()` check matches reliably.
          MARKER="<!-- countly-content-widget-test-result -->"

          if [ ! -f "$SUMMARY" ]; then
            cat > /tmp/pr-comment.md <<MARKDOWN
          $MARKER
          ## ⚠️ Content & Feedback Widget Test — sweep crashed

          The sweep didn't produce a summary.md. See the workflow run logs
          and artifacts for diagnostics.

          [📊 Workflow run]($RUN_URL)
          MARKDOWN
          else
            # Count totals across all per-variant verdict.json for the headline.
            TOTALS=$(python3 - "$RUN_DIR" <<'PY'
          import json, sys, glob, os
          run_dir = sys.argv[1]
          P = F = W = S = 0
          for p in sorted(glob.glob(os.path.join(run_dir, "*", "verdict.json"))):
              v = json.load(open(p))
              for c in v["checklist"].values():
                  s = c["status"]
                  if   s == "PASS": P += 1
                  elif s == "FAIL": F += 1
                  elif s == "WARN": W += 1
                  elif s == "SKIP": S += 1
          icon = "✅" if F == 0 else "❌"
          print(f"{icon} **Total: {P} PASS / {F} FAIL / {W} WARN / {S} SKIP**")
          PY
          )
            # `tail -n +2` strips the leading H1 from summary.md so the
            # comment opens with our own header. Heredoc keeps embedded
            # backticks/markdown intact.
            SUMMARY_BODY=$(tail -n +2 "$SUMMARY")
            cat > /tmp/pr-comment.md <<MARKDOWN
          $MARKER
          ## Content & Feedback Widget Test — Run #$RUN_ID

          $TOTALS

          $SUMMARY_BODY

          ---
          [📊 Workflow run]($RUN_URL) · [📁 Artifacts]($RUN_URL#artifacts)

          *Per-variant verdict.json + logcat.txt + recording.mp4 in the artifact bundle.*
          MARKDOWN
          fi

          # Find an existing marker-tagged comment. Paginate so we don't
          # miss it on long PR threads. `head -n1` guards against any past
          # accidental duplicate (we update the oldest one and leave any
          # stragglers — they'll age out on the next manual cleanup).
          EXISTING_ID=$(gh api --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
            | head -n1)

          # Build the JSON payload via Python so embedded backticks /
          # markdown / newlines in the body are escaped correctly. Shell
          # heredoc + jq would also work but Python's json module is the
          # least error-prone here.
          python3 -c "import json; print(json.dumps({'body': open('/tmp/pr-comment.md').read()}))" \
            > /tmp/pr-comment.json

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing comment $EXISTING_ID"
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING_ID" \
              --input /tmp/pr-comment.json --silent
          else
            echo "Creating new comment"
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --input /tmp/pr-comment.json --silent
          fi

      # ------------------------------------------------------------------
      # The runner intentionally exits 0 even with test FAILs (the PR
      # comment + artifact upload are the source of truth for verdict).
      # This step only flips the workflow red when the runner actually
      # CRASHED — Python exception, emulator died, etc. — which is a real
      # CI signal that something needs investigation. Test-checklist FAILs
      # remain visible via the PR comment without blocking the workflow.
      # ------------------------------------------------------------------
      - name: Reflect runner crashes (not test FAILs)
        if: always()
        env:
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
        run: |
          if [ "$SWEEP_OUTCOME" != "success" ]; then
            echo "Sweep runner crashed (outcome: $SWEEP_OUTCOME) — see logs"
            exit 1
          fi
          echo "Sweep runner completed cleanly. Test verdicts in PR comment / artifacts."
