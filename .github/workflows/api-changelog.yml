name: Public API changelog

# A pull request that changes or removes a record of the public API must also change the CHANGELOG.md that API_FILES
# pairs it with, so that the release notes tell integrators about every such change. A record the pull request adds needs
# no line. A path ending in "/" stands for every file under it. The API check keeps each record in step with the SDK.
on:
  pull_request:
    branches: [master, staging, staging-nw]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read # to list the files the pull request changes

jobs:
  changelog:
    name: A public API change comes with a CHANGELOG line
    runs-on: ubuntu-24.04
    steps:
      - name: Check the files the pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          API_FILES: sdk/api/sdk.api=CHANGELOG.md sdk-native/api/sdk-native.api=sdk-native/CHANGELOG.md
        run: |
          changed=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | select(.status != "added") | .filename')
          changes() {
            case "$1" in
              */) printf '%s\n' "$changed" | awk -v prefix="$1" 'index($0, prefix) == 1 { found = 1 } END { exit !found }' ;;
              *) printf '%s\n' "$changed" | grep -qxF "$1" ;;
            esac
          }
          recorded_changed=no
          for pair in $API_FILES; do
            record=${pair%%=*}
            changelog=${pair#*=}
            if changes "$record"; then
              recorded_changed=yes
              if ! changes "$changelog"; then
                echo "::error::This pull request changes $record, which records the public API, but not $changelog. Add a line that tells integrators what changed."
                exit 1
              fi
            fi
          done
          if [ "$recorded_changed" = yes ]; then
            echo "The recorded public API changes, and the CHANGELOG changes with it."
          else
            echo "This pull request changes no recorded public API."
          fi
