name: "Dependency Security Scan"

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  # New advisories get published against dependencies we have not touched, so the scan has to
  # run on a timer and not only when someone edits a build file.
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Needed to post the scan result onto the pull request. A green check on its own says
  # nothing about what was scanned or what was waived.
  pull-requests: write

jobs:
  scan:
    name: "Scan resolved dependencies against OSV"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Resolves the real configurations rather than reading the build files, so transitive
      # dependencies and conflict-resolved versions are covered too.
      - name: Resolve dependency coordinates
        run: >
          ./gradlew --no-daemon
          -I .github/scripts/dependency-report.gradle
          -DdepReportOut=build/dependency-coordinates.txt
          collectDependencyCoordinates

      # Fails only on published dependencies — the ones integrators inherit. Build-only and
      # plugin-classpath findings are reported in the job summary without blocking.
      - name: Check against the OSV database
        env:
          OSV_FAIL_ON: HIGH
          OSV_REPORT_FILE: build/dependency-scan-report.md
        run: python3 .github/scripts/osv_scan.py build/dependency-coordinates.txt

      # Runs even when the scan failed — that is exactly when the report is worth reading.
      # Updates one comment in place rather than adding a new one per push.
      - name: Comment the result on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true  # a fork PR gets a read-only token; do not fail the scan over it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- countly-dependency-scan -->'
          REPORT=build/dependency-scan-report.md
          BODY=build/dependency-scan-comment.md
          {
            echo "$MARKER"
            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            else
              echo "## Dependency security scan"
              echo
              echo "The scan did not produce a report — it failed before reaching the OSV check."
              echo "See the workflow logs for details."
            fi
          } > "$BODY"

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@"$BODY" > /dev/null
            echo "Updated existing scan comment $EXISTING"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$BODY" > /dev/null
            echo "Posted new scan comment"
          fi

      - name: Upload resolved dependency list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-coordinates
          path: build/dependency-coordinates.txt
          if-no-files-found: warn
