name: Public API changes

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Breaking changes
    outputs:
      report: ${{ steps.report.outputs.report }}
    runs-on: ubuntu-24.04
    env:
      # Each module is paired with the changelog that records its breaking changes.
      API_MODULES: ":sdk=CHANGELOG.md,:sdk-native=sdk-native/CHANGELOG.md"
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also installs "tools", which Google removed from the SDK repository.
          packages: platform-tools

      # The first parent of the pull request's merge commit is the base branch it merges into.
      # A module the base branch does not have yet has no API to break, so it is left out.
      - name: Write the public API of the base branch
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          IFS=, read -ra entries <<< "$API_MODULES"
          modules=()
          for entry in "${entries[@]}"; do
            module="${entry%%=*}"
            if [ -d "${module#:}" ]; then
              modules+=("$module")
            fi
          done
          ./gradlew --init-script "$GITHUB_WORKSPACE/.github/scripts/public-api.init.gradle" \
            -DapiModules="$(IFS=,; echo "${modules[*]}")" -DapiDir="$RUNNER_TEMP/api" \
            "${modules[@]/%/:metalavaGenerateSignatureRelease}"

      - name: Compare the public API with the base branch
        run: |
          : > "$RUNNER_TEMP/breaking.txt"
          : > "$RUNNER_TEMP/changelogs.txt"
          IFS=, read -ra entries <<< "$API_MODULES"
          for entry in "${entries[@]}"; do
            module="${entry%%=*}"
            if [ ! -f "$RUNNER_TEMP/api/${module#:}.txt" ]; then
              continue
            fi
            if ./gradlew --init-script .github/scripts/public-api.init.gradle \
                -DapiModules="$module" -DapiDir="$RUNNER_TEMP/api" \
                "$module:metalavaCheckCompatibilityRelease" > "$RUNNER_TEMP/check.log" 2>&1; then
              continue
            fi
            if ! grep -q 'Found compatibility problems' "$RUNNER_TEMP/check.log"; then
              cat "$RUNNER_TEMP/check.log"
              echo "::error::Could not compare the public API of $module with the base branch."
              exit 1
            fi
            python3 .github/scripts/public_api.py --root-package ly.count.android.sdk --root-package ly.count.android.sdk.messaging \
              --root-package ly.count.android.sdknative \
              --signatures "$RUNNER_TEMP/api" --module-dir "${module#:}" "$RUNNER_TEMP/check.log" > "$RUNNER_TEMP/module.txt"
            if [ -s "$RUNNER_TEMP/module.txt" ]; then
              cat "$RUNNER_TEMP/module.txt" >> "$RUNNER_TEMP/breaking.txt"
              echo "${entry#*=}" >> "$RUNNER_TEMP/changelogs.txt"
            fi
          done
          # The head's own signatures, beside the base's, give what this pull request adds to the public API.
          modules=()
          for entry in "${entries[@]}"; do
            modules+=("${entry%%=*}")
          done
          ./gradlew --init-script .github/scripts/public-api.init.gradle -DapiModules="$(IFS=,; echo "${modules[*]}")" \
            -DapiDir="$RUNNER_TEMP/api-head" "${modules[@]/%/:metalavaGenerateSignatureRelease}"
          python3 .github/scripts/public_api.py --root-package ly.count.android.sdk --root-package ly.count.android.sdk.messaging \
            --root-package ly.count.android.sdknative --signatures "$RUNNER_TEMP/api" --added "$RUNNER_TEMP/api-head" > "$RUNNER_TEMP/added.txt"

      - name: Report the public API changes
        id: report
        run: bash .github/scripts/public_api_report.sh "$RUNNER_TEMP/breaking.txt" "$RUNNER_TEMP/added.txt"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-public-api
          path: ${{ runner.temp }}/ci-report-public-api
          if-no-files-found: ignore

      - name: Require a changelog entry for breaking changes
        run: |
          if [ ! -s "$RUNNER_TEMP/breaking.txt" ]; then
            exit 0
          fi
          missing=""
          while read -r changelog; do
            if git diff --quiet HEAD^1 HEAD -- "$changelog"; then
              missing="$missing $changelog"
            fi
          done < <(sort -u "$RUNNER_TEMP/changelogs.txt")
          if [ -n "$missing" ]; then
            echo "::error title=Breaking API change::This pull request breaks the public API without an entry in:$missing. The job summary lists each break."
            exit 1
          fi
          echo "::warning title=Breaking API change::This pull request breaks the public API. Check that the changelog marks it as a breaking change."

  comment:
    name: Comment the public API changes
    needs: api
    # A fork's or Dependabot's pull request only gets a read-only token, so its report stays in the job summary.
    if: >-
      always() && needs.api.outputs.report != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ needs.api.outputs.report }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- countly-public-api -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f "body=$REPORT" > /dev/null
          elif ! grep -qx 'No public API change.' <<< "$REPORT"; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f "body=$REPORT" > /dev/null
          fi
