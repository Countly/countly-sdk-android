// Emits every external module this build resolves as "group:name:version<TAB>scope" lines,
// to the file named by the `depReportOut` system property (default: build/dependency-coordinates.txt).
//
// Used by .github/workflows/dependency_security_scan.yml. Resolving the real configurations
// (rather than parsing the build files) is deliberate: it captures transitive dependencies and
// the version that conflict resolution actually picks, which is what ends up in the artifact.
//
// Two scopes, because they carry very different weight:
//
//   published — reachable from the runtime classpath of a module we publish to Maven Central
//               (:sdk, :sdk-native, :upload-plugin). Every integrator inherits these, so a
//               vulnerability here is ours to fix and blocks the scan.
//   build     — sample apps, test-only dependencies, and the Gradle plugin classpath. These
//               never reach an integrator, and the plugin classpath is mostly AGP's own
//               internals, which we cannot upgrade independently. Reported, never blocking.
//
// Run locally with:
//   ./gradlew -I .github/scripts/dependency-report.gradle collectDependencyCoordinates

import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// The repo sets org.gradle.configureondemand=true, which leaves subprojects unevaluated unless
// something asks for them. An unevaluated project reports no configurations, so the scan would
// silently cover only part of the build.
gradle.startParameter.configureOnDemand = false

// Configurations that carry what a consumer of the published artifact actually gets.
def PUBLISHED_CONFIGS = ["releaseRuntimeClasspath", "runtimeClasspath"] as Set

// Everything else worth knowing about: sample-app runtimes and test classpaths.
def BUILD_CONFIGS = [
  "debugRuntimeClasspath",
  "debugAndroidTestRuntimeClasspath",
  "debugUnitTestRuntimeClasspath",
  "testRuntimeClasspath",
] as Set

gradle.rootProject { rootProject ->
  rootProject.tasks.register("collectDependencyCoordinates") {
    group = "verification"
    description = "Collect all resolved external dependency coordinates for security scanning."
    notCompatibleWithConfigurationCache("Resolves every project's configurations at execution time.")

    doLast {
      def outputPath = System.getProperty("depReportOut") ?:
        new File(rootProject.layout.buildDirectory.get().asFile, "dependency-coordinates.txt").path

      def scopes = [:]   // coordinate -> "published" | "build"
      def skipped = []

      def collectFrom = { configuration, String scope, String label ->
        try {
          configuration.incoming.resolutionResult.allComponents.each { component ->
            def id = component.id
            if (id instanceof ModuleComponentIdentifier) {
              def coordinate = "${id.group}:${id.module}:${id.version}".toString()
              // "published" always wins: the same artifact reached both ways is still shipped.
              if (scope == "published" || !scopes.containsKey(coordinate)) {
                scopes[coordinate] = scope
              }
            }
          }
        } catch (Exception e) {
          // A configuration that cannot resolve here (missing variant, platform-only, needs
          // credentials) must not take the whole scan down, but it must be visible: an
          // unreported skip reads as "clean" when it is really "unchecked".
          skipped << "${label}: ${e.class.simpleName}: ${e.message?.readLines()?.first()}".toString()
        }
      }

      rootProject.allprojects.each { project ->
        // Detect published modules by the plugin that publishes them, so adding or dropping a
        // published artifact does not need this file edited too.
        def isPublished = project.plugins.hasPlugin("com.vanniktech.maven.publish")

        project.configurations.each { configuration ->
          if (!configuration.canBeResolved) {
            return
          }
          if (isPublished && PUBLISHED_CONFIGS.contains(configuration.name)) {
            collectFrom(configuration, "published", "${project.path}:${configuration.name}")
          } else if (PUBLISHED_CONFIGS.contains(configuration.name) || BUILD_CONFIGS.contains(configuration.name)) {
            collectFrom(configuration, "build", "${project.path}:${configuration.name}")
          }
        }

        def buildscriptClasspath = project.buildscript.configurations.findByName("classpath")
        if (buildscriptClasspath != null) {
          collectFrom(buildscriptClasspath, "build", "${project.path}:buildscript.classpath")
        }
      }

      def outputFile = new File(outputPath)
      outputFile.parentFile?.mkdirs()
      outputFile.withWriter { writer ->
        scopes.keySet().sort().each { coordinate ->
          writer.writeLine("${coordinate}\t${scopes[coordinate]}")
        }
      }

      def publishedCount = scopes.count { it.value == "published" }
      logger.lifecycle("Collected ${scopes.size()} resolved dependency coordinates " +
        "(${publishedCount} published, ${scopes.size() - publishedCount} build-only) -> ${outputFile}")
      skipped.each { logger.warn("[dependency-report] could not resolve ${it}") }
    }
  }
}
