apply plugin: 'com.android.library'
apply plugin: "com.vanniktech.maven.publish" //for publishing

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

android {
  namespace 'ly.count.android.sdk'
  // Kotlin, bytecode level and the consumer contract check for library modules are set once in the
  // root build.gradle, so :sdk and :sdk-native cannot drift apart again.
  compileSdk 37
  buildToolsVersion "37.0.0"

  defaultConfig {
    minSdk 21
    targetSdk 37

    // Integrators can compile against SDK 24 and up. Not 21, although that is the runtime minimum: R8
    // silently removes any override of a platform callback that the app's own android.jar does not
    // declare. CountlyWebViewClient overrides shouldOverrideUrlLoading(WebView, WebResourceRequest)
    // (API 24) and onReceivedError/onReceivedHttpError (API 23), so below 24 a minified app loses the
    // SDK's link routing and scheme blocking on API 24+ devices while its build stays green (measured
    // on AGP 7.4.2 and 9.3.2). Raise this whenever an override of a newer platform callback is added.
    // consumer-rules.pro covers the platform classes referenced above 24; verifyConsumerContract
    // checks that the declaration is present.
    aarMetadata {
      minCompileSdk 24
    }
    consumerProguardFiles 'consumer-rules.pro'

    testInstrumentationRunner 'ly.count.android.sdk.test.InstrumentationTestRunner'
    testHandleProfiling true
    testFunctionalTest true
  }
  buildTypes {
    debug {
      // Opt-in with -Pcoverage: jacoco instruments every debug class, which slows the emulator suite and
      // widens its timing-sensitive assertions. CI passes it to produce the report Codacy ingests.
      enableAndroidTestCoverage project.hasProperty('coverage')
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  lint {
    abortOnError false
  }

  // This enables long timeouts required on slow environments, e.g. Travis
  installation {
    timeOutInMs 20 * 60 * 1000 // 20 minutes
    installOptions = ["-d", "-t"]
  }
  testNamespace 'ly.count.android.sdk.test'

  // scRQ_RequestScenarioTests reads the request records in api/requests/ as assets
  sourceSets {
    androidTest {
      assets.srcDir 'api'
    }
  }
}

def mockitoVersion = "5.23.0"
def annotationVersion = "1.3.0"
def lifecycleVersion = "2.3.1"

dependencies {
  api fileTree(dir: 'libs', include: ['*.jar'])
  // Newest versions that impose no compile floor on integrators and bring no Kotlin standard library:
  // lifecycle 2.4+ forces consumers to compileSdk 31 (2.6+: 33, 2.7+: 34), annotation 1.4+ depends on
  // kotlin-stdlib. Dependabot is told to leave them alone in .github/dependabot.yml.
  implementation "androidx.annotation:annotation:${annotationVersion}"
  implementation "androidx.lifecycle:lifecycle-common:${lifecycleVersion}"
  implementation "androidx.lifecycle:lifecycle-process:${lifecycleVersion}"
  // Optional: the app adds it to have the Play Install Referrer read. The SDK checks for it at runtime
  // (PlayInstallReferrerReader), so apps without it build and run; consumer-rules.pro keeps R8 quiet.
  compileOnly "com.android.installreferrer:installreferrer:2.2"

  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'junit:junit:4.13.2'

  androidTestImplementation "org.mockito:mockito-android:${mockitoVersion}"
  androidTestImplementation "com.squareup.okhttp3:mockwebserver:5.5.0"
}

// After a deliberate change to the requests the SDK queues: run the connected tests, then this task, which writes the
// records the failing scRQ_RequestScenarioTests printed into api/requests/. Check the difference and add a CHANGELOG.md line.
tasks.register('requestsUpdate') {
  description = 'Writes the request records the last connected test run printed into api/requests/.'
  def results = layout.buildDirectory.dir('outputs/androidTest-results/connected')
  doLast {
    def reports = fileTree(results) { include '**/TEST-*.xml' }.files
    if (reports.isEmpty()) throw new GradleException('No connected test results: run ./gradlew :sdk:connectedDebugAndroidTest first')
    def written = new TreeSet()
    reports.each { report ->
      def failures = new groovy.xml.XmlSlurper().parse(report).'**'.findAll { it.name() == 'failure' }*.text().join('\n')
      (failures =~ /(?s)----- ([a-z-]+)\.json -----\n(.*?)----- end -----/).each { match ->
        def lines = match[2].readLines().collect { it.startsWith('| ') ? it.substring(2) : (it == '|' ? '' : it) }
        file("api/requests/${match[1]}.json").setText(lines.join('\n') + '\n', 'UTF-8')
        written << match[1]
      }
    }
    logger.lifecycle("requestsUpdate, wrote ${written.isEmpty() ? 'nothing: no scenario failed' : written.collect { "api/requests/${it}.json" }.join(', ')}")
  }
}