apply plugin: 'com.android.library'
apply plugin: "com.vanniktech.maven.publish" //for publishing

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    //classpath "com.vanniktech:gradle-android-junit-jacoco-plugin:0.16.0" //test coverage reports
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

android {
  namespace 'ly.count.android.sdk'
  // Kotlin, bytecode level and the consumer contract check for library modules are set once in the
  // root build.gradle, so :sdk and :sdk-native cannot drift apart again.
  compileSdk 37
  buildToolsVersion "37.0.0"

  defaultConfig {
    minSdk 21
    targetSdk 37

    // Integrators can compile against SDK 24 and up. Not 21, although that is the runtime minimum: R8
    // silently removes any override of a platform callback that the app's own android.jar does not
    // declare. CountlyWebViewClient overrides shouldOverrideUrlLoading(WebView, WebResourceRequest)
    // (API 24) and onReceivedError/onReceivedHttpError (API 23), so below 24 a minified app loses the
    // SDK's link routing and scheme blocking on API 24+ devices while its build stays green (measured
    // on AGP 7.4.2 and 9.3.2). Raise this whenever an override of a newer platform callback is added.
    // consumer-rules.pro covers the platform classes referenced above 24; verifyConsumerContract
    // checks that the declaration is present.
    aarMetadata {
      minCompileSdk 24
    }
    consumerProguardFiles 'consumer-rules.pro'

    testInstrumentationRunner 'ly.count.android.sdk.test.InstrumentationTestRunner'
    testHandleProfiling true
    testFunctionalTest true
  }
  buildTypes {
    debug {
      //should be set to 'true' for jacoco code coverage
      enableUnitTestCoverage false
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  lint {
    abortOnError false
  }

  // This enables long timeouts required on slow environments, e.g. Travis
  installation {
    timeOutInMs 20 * 60 * 1000 // 20 minutes
    installOptions = ["-d", "-t"]
  }
  testNamespace 'ly.count.android.sdk.test'
}

def mockitoVersion = "5.23.0"
def annotationVersion = "1.3.0"
def lifecycleVersion = "2.3.1"

dependencies {
  api fileTree(dir: 'libs', include: ['*.jar'])
  // Newest versions that impose no compile floor on integrators and bring no Kotlin standard library:
  // lifecycle 2.4+ forces consumers to compileSdk 31 (2.6+: 33, 2.7+: 34), annotation 1.4+ depends on
  // kotlin-stdlib. Dependabot is told to leave them alone in .github/dependabot.yml.
  implementation "androidx.annotation:annotation:${annotationVersion}"
  implementation "androidx.lifecycle:lifecycle-common:${lifecycleVersion}"
  implementation "androidx.lifecycle:lifecycle-process:${lifecycleVersion}"

  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'junit:junit:4.13.2'

  androidTestImplementation "org.mockito:mockito-android:${mockitoVersion}"
  androidTestImplementation "com.squareup.okhttp3:mockwebserver:5.5.0"
}

