apply plugin: 'com.android.library'
apply plugin: "com.vanniktech.maven.publish" //for publishing

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    //classpath "com.vanniktech:gradle-android-junit-jacoco-plugin:0.16.0" //test coverage reports
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

android {
  namespace 'ly.count.android.sdk'
  compileSdk 37
  buildToolsVersion "37.0.0"

  defaultConfig {
    minSdk 21
    targetSdk 37

    // AGP 9 defaults the AAR's minCompileSdk to this module's compileSdk (37), which would force
    // every integrator to compile against SDK 37; 26.1.5 then declared 34. Customers outside Google
    // Play build with old toolchains, so declare the lowest floor that is actually safe. That is 24,
    // not the runtime minimum of 21, for two independent reasons. First, below 24 an integrator's
    // R8 cannot see that our WebViewClient methods override platform callbacks introduced in API
    // 23/24 and silently deletes them from a minified app. Second, StorageVolume (API 24), used by the
    // disk metrics, is the newest platform class our live code references that consumer-rules.pro
    // does not cover; at 24 it needs no rule. Everything newer sits behind SDK_INT checks and is
    // listed in consumer-rules.pro so R8 does not reject it. The androidx dependencies are pinned
    // to versions that declare no floor of their own, because the consumer-side check applies to
    // every AAR in the graph, not just ours.
    aarMetadata {
      minCompileSdk 24
    }
    consumerProguardFiles 'consumer-rules.pro'

    testInstrumentationRunner 'ly.count.android.sdk.test.InstrumentationTestRunner'
    testHandleProfiling true
    testFunctionalTest true
  }
  buildTypes {
    debug {
      //should be set to 'true' for jacoco code coverage
      enableUnitTestCoverage false
      multiDexEnabled true
    }
    release {
      minifyEnabled false
      multiDexEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  lint {
    abortOnError false
  }

  // This enables long timeouts required on slow environments, e.g. Travis
  installation {
    timeOutInMs 20 * 60 * 1000 // 20 minutes
    installOptions = ["-d", "-t"]
  }
  testNamespace 'ly.count.android.sdk.test'
}

def mockitoVersion = "4.11.0"

dependencies {
  api fileTree(dir: 'libs', include: ['*.jar'])
  // Pinned to the newest versions that impose no compile floor and pull no Kotlin standard library
  // (see aarMetadata): lifecycle 2.4+ makes consumers compile against SDK 31 or higher, 2.6+ 33,
  // 2.7+ 34; annotation 1.4+ depends on kotlin-stdlib.
  implementation 'androidx.annotation:annotation:1.3.0'
  implementation 'androidx.lifecycle:lifecycle-common:2.3.1'
  implementation 'androidx.lifecycle:lifecycle-process:2.3.1'

  implementation "androidx.multidex:multidex:2.0.1" //required for as long the min SDK version is smaller than 21

  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test:rules:1.5.0'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'junit:junit:4.13.2'

  androidTestImplementation "org.mockito:mockito-android:${mockitoVersion}"
  androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}

