apply plugin: 'com.android.library'
apply plugin: "com.vanniktech.maven.publish" //for publishing

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    //classpath "com.vanniktech:gradle-android-junit-jacoco-plugin:0.16.0" //test coverage reports
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

// This is the "nw" (no WebView) branch. It carries the same source as the regular SDK with two
// settings enforced at init, WebView UI off and console logging off in production builds, neither of
// which the config can turn back on, and it always publishes as 'ly.count.android:sdk-nw'. Keep this
// branch a one way target: merge from the release branch into it, never the other way around, and do
// not cut the regular 'ly.count.android:sdk' release from here.

android {
  namespace 'ly.count.android.sdk'
  compileSdk 37
  buildToolsVersion "37.0.0"

  defaultConfig {
    minSdk 21
    targetSdk 37

    // AGP 9 defaults the AAR's minCompileSdk to this module's compileSdk (37), which would
    // force every integrator to compile against SDK 37. The SDK's real compile floor is 34
    // (Build.VERSION_CODES.UPSIDE_DOWN_CAKE / WindowMetrics.getDensity()), so declare that
    // instead and keep integrators off a needless toolchain bump. All prior releases shipped
    // with no floor (minCompileSdk=1).
    aarMetadata {
      minCompileSdk 34
    }

    testInstrumentationRunner 'ly.count.android.sdk.test.InstrumentationTestRunner'
    testHandleProfiling true
    testFunctionalTest true
  }
  buildTypes {
    debug {
      //should be set to 'true' for jacoco code coverage
      enableUnitTestCoverage false
      multiDexEnabled true
    }
    release {
      minifyEnabled false
      multiDexEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  lint {
    abortOnError false
  }

  // This enables long timeouts required on slow environments, e.g. Travis
  installation {
    timeOutInMs 20 * 60 * 1000 // 20 minutes
    installOptions = ["-d", "-t"]
  }
  testNamespace 'ly.count.android.sdk.test'
}

//this branch is published under its own artifact id, everything else comes from gradle.properties
mavenPublishing {
  coordinates(GROUP.toString(), 'sdk-nw', VERSION_NAME.toString())
  pom {
    name = 'Countly Android SDK (no WebView)'
    description = 'Android SDK for Countly mobile analytics, with all of the SDK\'s WebView based UI disabled and console logging kept off in production builds, enforced and not configurable'
  }
}

def mockitoVersion = "4.11.0"

dependencies {
  api fileTree(dir: 'libs', include: ['*.jar'])
  implementation 'androidx.annotation:annotation:1.6.0'
  implementation 'androidx.lifecycle:lifecycle-common:2.6.1'
  implementation 'androidx.lifecycle:lifecycle-process:2.6.1'

  implementation "androidx.multidex:multidex:2.0.1" //required for as long the min SDK version is smaller than 21

  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test:rules:1.5.0'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'junit:junit:4.13.2'

  androidTestImplementation "org.mockito:mockito-android:${mockitoVersion}"
  androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}

