apply plugin: 'com.android.library'
apply plugin: "com.vanniktech.maven.publish"

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

android {
  namespace 'ly.count.android.sdknative'
  compileSdk 37

  defaultConfig {
    minSdk 21
    targetSdk 37

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  buildToolsVersion '37.0.0'
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  //testImplementation 'junit:junit:4.13.2'
  //androidTestImplementation 'androidx.test:runner:1.3.0'
  //androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}

task copyLibs(type: Copy) {
  from "libs"
  into "src/main/jniLibs"
}

// The prebuilt .so files in libs/ are staged into the jniLibs source dir, which the
// AGP merge*JniLibFolders tasks then consume. Gradle 9 promotes this implicit
// dependency to a hard error, so wire it explicitly (replaces the deprecated
// tasks.whenTaskAdded hook).
tasks.matching { it.name ==~ /merge.*JniLibFolders/ }.configureEach {
  dependsOn copyLibs
}
