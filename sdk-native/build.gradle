apply plugin: 'com.android.library'
apply plugin: "com.vanniktech.maven.publish"

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

android {
  namespace 'ly.count.android.sdknative'
  compileSdk 37

  defaultConfig {
    minSdk 21
    targetSdk 37

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  buildToolsVersion '37.0.0'
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  testImplementation 'junit:junit:4.13.2'

  //androidTestImplementation 'androidx.test:runner:1.3.0'
  //androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}

task copyLibs(type: Copy) {
  from "libs"
  into "src/main/jniLibs"
}

// The prebuilt .so files in libs/ are staged into the jniLibs source dir, which the
// AGP merge*JniLibFolders tasks then consume. Gradle 9 promotes this implicit
// dependency to a hard error, so wire it explicitly (replaces the deprecated
// tasks.whenTaskAdded hook).
tasks.matching { it.name ==~ /merge.*JniLibFolders/ }.configureEach {
  dependsOn copyLibs
}

// The unit tests inspect the same staged copies, so they need the staging to have
// happened too. They reach the .so files through a plain relative path, which Gradle
// cannot see, so declare them as inputs as well: without that the test task stays
// UP-TO-DATE (or resolves straight out of the build cache, which is enabled here) after
// the binaries change, and a misaligned rebuild would be reported as green.
tasks.matching { it.name ==~ /test.*UnitTest/ }.configureEach {
  dependsOn copyLibs
  inputs.dir(layout.projectDirectory.dir('src/main/jniLibs'))
    .withPropertyName('packagedNativeLibraries')
    .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(layout.projectDirectory.dir('libs'))
    .withPropertyName('precompiledNativeLibraries')
    .withPathSensitivity(PathSensitivity.RELATIVE)
}
