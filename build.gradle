// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext.kotlin_version = '2.4.10'
  repositories {
    maven {
      url 'https://developer.huawei.com/repo/'
    }
    google()
    mavenCentral()
    // CycloneDX publishes its Gradle plugin 3.x only on the Gradle Plugin Portal.
    gradlePluginPortal {
      content { includeGroup 'org.cyclonedx' }
    }
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:9.3.2'

    classpath 'com.google.gms:google-services:4.5.0'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    classpath 'com.huawei.agconnect:agcp:1.9.6.300'
    classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.9.8"
    classpath 'org.cyclonedx:cyclonedx-gradle-plugin:3.4.1'
  }
}

allprojects {
  tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
  }
  repositories {
    google()
    mavenCentral()
  }
}

// What every published library module (:sdk, :sdk-native) promises integrators, in one place: 26.1.5
// shipped with AGP 9 defaults that silently raised what apps had to build with, and the fix landed in
// one module but not the other. The contract is Java 8 bytecode, no Kotlin standard library in the POM,
// and an explicitly declared compile floor; verifyConsumerContract fails `check` when any of it drifts.
subprojects {
  plugins.withId('com.android.library') {
    android {
      // No library module has Kotlin sources; AGP 9's built-in Kotlin would still add kotlin-stdlib to
      // the POM at the build's Kotlin version and force that version onto every integrator.
      enableKotlin = false
      // Older Gradle and AGP releases cannot read class files newer than Java 8; AGP 9 defaults to 11.
      compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
      }
    }

    def verifyConsumerContract = tasks.register('verifyConsumerContract') {
      description = 'Fails if the published AAR/POM would force a newer toolchain on integrators.'
      dependsOn 'bundleReleaseAar', 'generatePomFileForMavenPublication'
      def aar = layout.buildDirectory.file("outputs/aar/${project.name}-release.aar")
      def pom = layout.buildDirectory.file('publications/maven/pom-default.xml')
      inputs.files(aar, pom)
      doLast {
        def problems = []
        def declared = android.defaultConfig.aarMetadata.minCompileSdk
        if (declared == null) problems << 'aarMetadata.minCompileSdk is not declared, so AGP would publish compileSdk as the floor'
        new java.util.zip.ZipFile(aar.get().asFile).withCloseable { zip ->
          def props = new Properties(); props.load(zip.getInputStream(zip.getEntry('META-INF/com/android/build/gradle/aar-metadata.properties')))
          if (declared != null && props.getProperty('minCompileSdk') != declared.toString()) problems << "aar-metadata minCompileSdk=${props.getProperty('minCompileSdk')} but the module declares ${declared}"
          def classes = new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry('classes.jar')))
          def entry
          while ((entry = classes.nextEntry) != null) {
            if (!entry.name.endsWith('.class')) continue
            def bytes = classes.readAllBytes()
            int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
            if (major > 52) { problems << "${entry.name} is class file version ${major}; Java 8 is 52"; break }
          }
        }
        if (pom.get().asFile.text.contains('kotlin-stdlib')) problems << 'POM declares a kotlin-stdlib dependency'
        if (!problems.isEmpty()) throw new GradleException("Consumer contract broken in :${project.name}:\n  " + problems.join('\n  '))
      }
    }
    tasks.named('check') { dependsOn verifyConsumerContract }

    // The public API of the release AAR: its public and protected classes and members as javap prints them, members
    // sorted. apiCheck fails `check` when it differs from api/<module>.api; apiDump rewrites that file after a
    // deliberate change, which then needs a line in the module's CHANGELOG.md. Classes in a package named internal are
    // left out: they are public only so that the SDK's own packages can call them.
    def apiFile = file("api/${project.name}.api")
    def changelog = file('CHANGELOG.md').exists() ? "${project.name}/CHANGELOG.md" : 'CHANGELOG.md'
    def releaseAar = layout.buildDirectory.file("outputs/aar/${project.name}-release.aar")
    def publicApi = { File workDir ->
      def jar = new File(workDir, 'classes.jar')
      new java.util.zip.ZipFile(releaseAar.get().asFile).withCloseable { zip -> jar.bytes = zip.getInputStream(zip.getEntry('classes.jar')).bytes }
      def names = new java.util.zip.ZipFile(jar).withCloseable { zip ->
        zip.entries().toList()*.name.findAll { it.endsWith('.class') && !it.endsWith('-info.class') }.collect { it[0..-7].replace('/', '.') }.sort()
      }
      def javap = ['bin/javap.exe', 'bin/javap'].collect { new File(System.getProperty('java.home'), it) }.find { it.exists() }
      def output = new StringBuilder()
      // javap reads no argument files, so the class names go on the command line in batches that fit Windows' limit
      names.collate(100).each { batch ->
        def process = new ProcessBuilder([javap.path, '-protected', '-classpath', jar.path] + batch).redirectErrorStream(true).start()
        def text = process.inputStream.getText('UTF-8')
        if (process.waitFor() != 0) throw new GradleException("javap failed for :${project.name}:\n${text}")
        output << text
      }
      def classes = []
      def current = null
      output.toString().readLines().each { line ->
        if (current == null) {
          if (line.endsWith(' {')) current = [header: line, members: []]
        } else if (line == '}') {
          classes << current
          current = null
        } else {
          current.members << line.trim()
        }
      }
      def nameOf = { String header -> header.split(' ').find { it.contains('.') } }
      "// Public API of :${project.name}: the public and protected classes and members of its release AAR, as javap prints them.\n" +
        "// Classes in a package named internal are left out. ./gradlew :${project.name}:apiDump writes this file, and\n" +
        "// ./gradlew check fails when the AAR no longer matches it. A change here needs a line in ${changelog} that tells\n" +
        "// integrators what changed.\n" +
        classes.findAll { (it.header.startsWith('public ') || it.header.startsWith('protected ')) && !nameOf(it.header).contains('.internal.') }
          .sort { c -> nameOf(c.header) }
          .collect { c -> "\n${c.header}\n" + c.members.sort().collect { "  ${it}\n" }.join('') + '}\n' }
          .join('')
    }
    // The lines of an API file with each member prefixed by its class, so that a difference names the class.
    def qualifiedLines = { String text ->
      def lines = []
      def owner = null
      text.readLines().each { line ->
        if (line.isEmpty() || line.startsWith('//')) return
        if (line.endsWith(' {')) {
          owner = line[0..-3].split(' ').find { it.contains('.') }
          lines << line[0..-3]
        } else if (line == '}') {
          owner = null
        } else {
          lines << "${owner}: ${line.trim()}"
        }
      }
      lines
    }
    tasks.register('apiDump') {
      description = "Writes the public API of the release AAR to api/${project.name}.api."
      dependsOn 'bundleReleaseAar'
      inputs.file(releaseAar)
      outputs.file(apiFile)
      doLast {
        apiFile.parentFile.mkdirs()
        apiFile.setText(publicApi(temporaryDir), 'UTF-8')
        logger.lifecycle("apiDump, wrote ${rootProject.relativePath(apiFile).replace(File.separator, '/')}")
      }
    }
    def apiCheck = tasks.register('apiCheck') {
      description = "Fails if the public API of the release AAR differs from api/${project.name}.api."
      dependsOn 'bundleReleaseAar'
      inputs.file(releaseAar)
      doLast {
        def path = rootProject.relativePath(apiFile).replace(File.separator, '/')
        if (!apiFile.exists()) throw new GradleException("No ${path}: run ./gradlew :${project.name}:apiDump")
        def committed = apiFile.getText('UTF-8').replace('\r\n', '\n')
        def current = publicApi(temporaryDir)
        if (committed != current) {
          def was = qualifiedLines(committed)
          def now = qualifiedLines(current)
          def report = []
          if (was - now) {
            report << "Removed or changed, which breaks apps that use it (start the ${changelog} line with \"! Minor breaking change !\"):"
            report.addAll((was - now).collect { "  - ${it}" })
          }
          if (now - was) {
            report << 'New, or the new form of a changed line:'
            report.addAll((now - was).collect { "  + ${it}" })
          }
          if (report.isEmpty()) report << 'The same lines, in another order.'
          def summary = System.getenv('GITHUB_STEP_SUMMARY')
          if (summary) new File(summary).append("### Public API changes of :${project.name} against ${path}\n```\n${report.join('\n')}\n```\n", 'UTF-8')
          throw new GradleException("The public API of :${project.name} differs from ${path}:\n" + report.join('\n') +
            "\nIf the change is deliberate, run ./gradlew :${project.name}:apiDump, check the difference and add a line to ${changelog}.")
        }
      }
    }
    tasks.named('check') { dependsOn apiCheck }
  }
}

// Publishing modules: the local staging repository release.yml uploads from, and the SBOM of the published runtime classpath.
subprojects {
  plugins.withId('com.vanniktech.maven.publish') {
    publishing {
      repositories {
        maven {
          name = 'releaseStaging'
          url = rootProject.file('build/release-staging')
        }
      }
    }
    apply plugin: 'org.cyclonedx.bom'
    tasks.named('cyclonedxDirectBom').configure {
      includeConfigs = [project.plugins.hasPlugin('com.android.library') ? 'releaseRuntimeClasspath' : 'runtimeClasspath']
    }
  }
}
