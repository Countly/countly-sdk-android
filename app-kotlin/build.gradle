plugins {
  id 'com.android.application'
  // AGP 9 built-in Kotlin replaces the kotlin-android plugin; kapt moves to com.android.legacy-kapt
  // (resolved from google() via pluginManagement, versioned to match AGP).
  id 'com.android.legacy-kapt' version '9.3.2'
  id 'androidx.navigation.safeargs.kotlin'
}

android {
  namespace "ly.count.android.demo.kotlin"
  compileSdk 37

  defaultConfig {
    applicationId "ly.count.android.demo.kotlin"
    minSdk 21
    targetSdk 37
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  
  buildFeatures {
    dataBinding = true
    viewBinding = true
  }
}

dependencies {

  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
  implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
  implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

  implementation project(':sdk')
}