buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

plugins {
  id 'java-gradle-plugin'
  id 'groovy'
}

// Integrators run this plugin inside their own Gradle, on whatever JDK their build uses. Compile it
// for Java 8 so a Gradle on JDK 11 can still resolve and load it (module metadata records the JVM
// target as a hard requirement); earlier releases declared whatever JDK happened to run the release build.
java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

gradlePlugin {
  plugins {
    uploadSymbolPlugin {
      id = 'ly.count.android.plugins.upload-symbols'
      implementationClass = 'ly.count.android.plugins.UploadSymbolsPlugin'
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation gradleApi()
  implementation localGroovy()
  implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}

apply plugin: "com.vanniktech.maven.publish"