buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

plugins {
  id 'java-gradle-plugin'
  id 'groovy'
}

// Gradle only resolves a plugin when the JVM running the build is at least the bytecode level it
// declares, so compile to 17, the floor AGP 8+ already imposes on integrators, rather than to
// whatever JDK happens to run the release build.
java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

gradlePlugin {
  plugins {
    uploadSymbolPlugin {
      id = 'ly.count.android.plugins.upload-symbols'
      implementationClass = 'ly.count.android.plugins.UploadSymbolsPlugin'
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation gradleApi()
  implementation localGroovy()
  implementation 'com.squareup.okhttp3:okhttp:3.14.9'

  testImplementation 'junit:junit:4.13.2'
}

apply plugin: "com.vanniktech.maven.publish"