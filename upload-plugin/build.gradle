buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0' //for publishing
  }
}

plugins {
  id 'java-gradle-plugin'
  id 'groovy'
  id 'jacoco'
}

// Gradle only resolves a plugin when the JVM running the build is at least the bytecode level it
// declares, so compile to Java 8, which every Gradle and AGP version the plugin supports runs on.
java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

gradlePlugin {
  plugins {
    uploadSymbolPlugin {
      id = 'ly.count.android.plugins.upload-symbols'
      implementationClass = 'ly.count.android.plugins.UploadSymbolsPlugin'
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation gradleApi()
  implementation localGroovy()
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  testImplementation 'junit:junit:4.13.2'
}

// XML is the format Codacy ingests; build_and_test_sdk.yml uploads it next to :sdk's report.
tasks.named('jacocoTestReport') {
  reports {
    xml.required = true
  }
}

apply plugin: "com.vanniktech.maven.publish"