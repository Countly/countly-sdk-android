apply plugin: 'com.android.application'

//required for huawei push
//apply plugin: 'com.huawei.agconnect'

// AGP 9 provides built-in Kotlin support (no explicit kotlin-android plugin needed)

android {
  namespace 'ly.count.android.benchmark'
  compileSdk 37

  defaultConfig {
    applicationId "ly.count.android.benchmark"
    minSdk 21
    targetSdk 37
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  signingConfigs {
    release {
      storeFile file('keys')
      keyAlias 'HWDemo'
      keyPassword 'countly'
      storePassword 'countly'
      enableV1Signing true
      enableV2Signing true
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.release
      minifyEnabled false
      //shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled true
      //shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  lint {
    abortOnError false
  }
}

dependencies {

  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'com.android.installreferrer:installreferrer:2.2'
  implementation project(path: ':sdk')
}